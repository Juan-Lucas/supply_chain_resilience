[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "supply_chain_resilience"
version = "0.0.1"
description = "Machine Learning-Based Delivery Delay Prediction for Supply Chain Resilience"
authors = [
  { name = "Jean-Luc MUPASA" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.11,<3.12"


[tool.ruff]
line-length = 99
src = ["supply_chain_resilience"]
include = ["pyproject.toml", "supply_chain_resilience/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["supply_chain_resilience"]
force-sort-within-sections = true

